name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: apply (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          # 1. full apply of the configuration from scratch, in a container
          - 01-fresh-apply
          # 2. re-apply of new changes onto an existing configuration
          - 02-reapply
    steps:
      - uses: actions/checkout@v7

      - name: Build the test container
        run: docker build -f tests/Dockerfile -t dotfiles-ci tests/

      # --network none: the scenarios stand up local git remotes for Homebrew
      # and the external repos, so a run that reaches for the network is a bug,
      # not a flake. The checkout is mounted read-only -- each scenario copies
      # it into its own throwaway $HOME.
      - name: Run scenario
        run: |
          docker run --rm --network none \
            --volume "$PWD:/repo:ro" \
            --env SOURCE_REPO=/repo \
            dotfiles-ci /repo/tests/run-tests.sh '${{ matrix.scenario }}'

  # The container job proves the manifests work on a bare account; this one
  # proves they work on the OS the dotfiles are actually for. macOS runners
  # cannot run the Linux container, so the suite runs natively here -- which is
  # why the harness avoids GNU-only `stat -c` / `find -printf`.
  apply-macos:
    name: apply-macos (${{ matrix.scenario }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - 01-fresh-apply
          - 02-reapply
    steps:
      - uses: actions/checkout@v7

      # stow is the one prerequisite the runner image does not ship. Everything
      # else the suite needs (bash, git, python3, zsh, tar, find) is preinstalled.
      # The runner's own Homebrew is used only to install it; the scenarios still
      # run against the stub in their sandbox HOME.
      - name: Install stow
        run: brew install stow

      # No --network none equivalent here, but the scenarios still stand up local
      # git remotes and never reach out; the container job is what enforces that.
      - name: Run scenario
        env:
          SOURCE_REPO: ${{ github.workspace }}
        run: tests/run-tests.sh '${{ matrix.scenario }}'

  # Single stable check to mark as required in the branch protection rule /
  # ruleset for main. Requiring the matrix jobs directly would mean pinning
  # "apply (01-fresh-apply)" and "apply (02-reapply)" by name, and a required
  # check that no longer exists blocks every PR -- so renaming a scenario or
  # adding a third one would silently wedge the repo. This job's name never
  # changes, and it fails unless every scenario in the matrix passed.
  #
  # Keep this workflow free of `paths:` filters: a required check that never
  # reports leaves PRs permanently un-mergeable.
  apply-tests:
    name: apply tests
    if: always()
    needs: [apply, apply-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Require every scenario to have passed
        env:
          RESULT: ${{ needs.apply.result }}
          RESULT_MACOS: ${{ needs.apply-macos.result }}
        run: |
          printf 'apply matrix result:       %s\n' "$RESULT"
          printf 'apply-macos matrix result: %s\n' "$RESULT_MACOS"
          [ "$RESULT" = success ] || exit 1
          [ "$RESULT_MACOS" = success ] || exit 1

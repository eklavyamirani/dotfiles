# Nix configuration for the dev account (Linux; inert on macOS, where this
# account's package manager is the isolated Homebrew in ~/.homebrew).
#
# Deployed by stow like every other managed file, which creates a small
# ordering wrinkle worth knowing about: on a fresh machine this file does not
# exist yet when bootstrap builds nix/flake.nix, because stow is one of
# the things that build produces. bootstrap.sh and reapply.sh therefore pass
# --extra-experimental-features on the nix command line rather than relying on
# this file. What it is for is every *interactive* use afterwards -- a bare
# `nix build`, `nix flake update`, `nix shell` -- so those do not each need
# the flag repeated.

# Flakes are how nix/flake.nix pins its nixpkgs revision in flake.lock;
# without nix-command they are still gated behind an experimental flag.
experimental-features = nix-command flakes

# Single-user install: /nix belongs to this account, so there is no daemon and
# no build-user group. Keep the store honest anyway.
warn-dirty = false

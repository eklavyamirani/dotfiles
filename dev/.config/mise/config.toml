# Global runtime versions for the isolated dev account.
#
# mise -- not Homebrew -- owns language runtimes here. Homebrew's formulae
# track a single moving version and upgrade underneath you on any `brew
# bundle`; pinned entries below are reproducible and per-project overridable
# by a repo-local .mise.toml.
#
# Activated by dev/.zprofile.d/55-mise.zsh. Applied by `./reapply.sh`,
# which runs `mise install` so a clone converges to exactly these versions.
#
# Versions are pinned exactly, on purpose: "3.12" would silently drift to
# whatever the latest 3.12.x is, which is the behaviour we just left brew for.
# Bump deliberately with `mise use -g python@<new>` and commit the result.
#
# Keep this list to runtimes that are genuinely global. A runtime used by a
# single project belongs in that project's own .mise.toml (`mise use
# dotnet@10.0.400` inside the repo), so the version travels with the code
# that needs it instead of being an account-wide fact. dotnet was pinned
# here briefly and removed for exactly that reason -- no dotnet project
# exists on this machine yet.

[tools]
python = "3.12.14"
